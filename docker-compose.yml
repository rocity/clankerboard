services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://clankerboard:clankerboard@db:5432/clankerboard
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Leave unset to let the app generate one and keep it in the database.
      AUTH_SECRET: ${AUTH_SECRET:-}
      OPEN_SIGNUP: ${OPEN_SIGNUP:-false}
      INVITE_TTL_HOURS: ${INVITE_TTL_HOURS:-168}
      # Done Tickets drop off the MCP board resource this many days after their last change.
      BOARD_DONE_WINDOW_DAYS: ${BOARD_DONE_WINDOW_DAYS:-14}
      # A reconnecting live stream that missed more Activity than this gets a `resync` event instead.
      STREAM_BACKLOG_LIMIT: ${STREAM_BACKLOG_LIMIT:-500}
      # Per-API-Key token bucket: burst size and requests earned back per second.
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-120}
      RATE_LIMIT_REFILL_PER_SECOND: ${RATE_LIMIT_REFILL_PER_SECOND:-2}
      # Invite emails go out only when SMTP_HOST is set. Links are always copyable.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # GitHub and Google sign-in turn on only when both values are set.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clankerboard
      POSTGRES_PASSWORD: clankerboard
      POSTGRES_DB: clankerboard
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clankerboard -d clankerboard"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Throwaway Postgres for Vitest and Playwright: `pnpm db:test:up`.
  db-test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clankerboard
      POSTGRES_PASSWORD: clankerboard
      POSTGRES_DB: postgres
      # A natural-language collation, as on glibc hosts and managed Postgres,
      # so ordering bugs that byte order would hide show up in tests.
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=en-US
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clankerboard"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
