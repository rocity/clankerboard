services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://clankerboard:clankerboard@db:5432/clankerboard
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clankerboard
      POSTGRES_PASSWORD: clankerboard
      POSTGRES_DB: clankerboard
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clankerboard -d clankerboard"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Throwaway Postgres for Vitest and Playwright: `pnpm db:test:up`.
  db-test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clankerboard
      POSTGRES_PASSWORD: clankerboard
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clankerboard"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
