<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Clankerboard</title>
    <script>
      // Applies the saved theme before first paint so a dark page never flashes light.
      // The key and values match apps/web/src/lib/theme.ts.
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem("clankerboard-theme");
        } catch {}
        const dark =
          saved === "dark" ||
          (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
